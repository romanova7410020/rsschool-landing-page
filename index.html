<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    />
  <link rel="stylesheet" href="style.css" />
    <title>Coffee House</title>
</head>
<body>
    <header class="header">
      <div class="container header__container">
        <a href="#" class="header__logo" >
          <img src="assets/logo.png" alt="logo">
        </a>
        <nav class="header__nav">
          <ul class="header__menu">
            <li class="header__menu-item">
              <a href="#favorite" class="header__menu-link">Favorite coffee</a>
            </li>
            <li class="header__menu-item">
              <a href="#about" class="header__menu-link">About</a>
            </li>
            <li class="header__menu-item">
              <a href="#mobile-app" class="header__menu-link">Mobile app</a>
            </li>
            <li class="header__menu-item">
              <a href="#contacts" class="header__menu-link">Contact us</a>
            </li>
          </ul>
        </nav>
        <div class="header__actions">
            <button class="theme-switcher" type="button" aria-label="Switch color theme">
                <span class="theme-switcher__sun">
                    <img src="assets/sun.png" alt="sun">
                </span>
                <span class="theme-switcher__moon">
                    <img src="assets/moon.png" alt="moon">
                </span>
            </button>
             <a class="menu-link" href="#menu">
                <span>Menu</span>
                <span class="menu-link__icon">
                    <img src="assets/coffee-cup.png" alt="coffee cup">
                </span>
            </a>
            <button class="header__burger" aria-label="Toggle menu">
            <span class="header__burger-line"></span>
            <span class="header__burger-line"></span>
            </button>
        </div>
      </div>
    </header>
    <main>
        <div class="main_container">
            
        </div>
    </main>
    <script src="main.js"></script>
</body>
</html>
